name: Java checks

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile
        run: javac -d build src/Car.java src/Main.java test/CarTest.java
      - name: Test
        run: java -cp build CarTest
      - name: Run demonstration
        run: java -cp build Main
